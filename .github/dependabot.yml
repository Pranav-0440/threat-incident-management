# Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for Frontend (NPM) - Grouped into 1 PR (Max 2 PRs open)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    target-branch: "main"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps-frontend)"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for Backend (Maven) - Grouped into 1 PR (Max 2 PRs open)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    target-branch: "main"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps-backend)"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Maintain GitHub Actions workflows - Grouped into 1 PR (Max 1 PR open)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    target-branch: "main"
    labels:
      - "dependencies"
      - "ci-cd"
    commit-message:
      prefix: "chore(deps-actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain Backend Docker base images (Max 1 PR open)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    target-branch: "main"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps-docker-backend)"

  # Maintain Frontend Docker base images (Max 1 PR open)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    target-branch: "main"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps-docker-frontend)"
